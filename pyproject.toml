[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-cli"
version = "0.1.0"
description = "Genera el esqueleto de un proyecto con un solo comando."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0",
    "questionary>=2.1",
    "rich>=15.0",
]

[project.scripts]
scaffold = "scaffold.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.6"]
build = ["pyinstaller>=6.22"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/scaffold/templates"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.setuptools.package-data]
scaffold = ["templates/**/*", "templates/**/.*"]
