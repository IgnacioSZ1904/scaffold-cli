[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold-cli"
version = "0.1.0"
description = "Genera el esqueleto de un proyecto con un solo comando."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.1",
]

[project.scripts]
scaffold = "scaffold.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
scaffold = ["templates/**/*", "templates/**/.*"]
