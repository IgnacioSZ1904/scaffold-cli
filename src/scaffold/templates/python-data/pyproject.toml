[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "$project_name"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.5",
    "pandas>=3.1",
    "matplotlib>=3.11",
]

[dependency-groups]
dev = ["pytest>=8", "jupyterlab>=4.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
